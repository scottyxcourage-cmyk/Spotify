<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIDER VOYAGE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">

    <h1 class="logo">SPIDER HUB</h1>

    <input type="text" id="searchInput" placeholder="Search music...">

    <ul>
      <li>Home</li>
      <li>Trending</li>
      <li>Artists</li>
      <li>Albums</li>
      <li>Playlists</li>
      <li>Genres</li>
      <li>Favorites</li>
      <li>Support</li>
    </ul>

  </aside>

  <main class="main">

    <section class="hero">
      <h2>SPIDER VOYAGE</h2>
      <p>Stream futuristic vibes.</p>
    </section>

    <div id="music-grid"></div>

  </main>

  <div class="player">

    <img id="player-image" src="" />

    <div>
      <h3 id="player-title">No song playing</h3>
      <p id="player-artist">SPIDER VOYAGE</p>
    </div>

    <audio id="audio-player" controls></audio>

  </div>

  <script src="script.js"></script>

</body>

</html>
